# main.yaml - WHAT to run.
#
# Configuration is layered. Each layer can override the one above it:
#
#   1. configs/main.yaml            <- THIS FILE: what to run (model, dataset, seed, outputs)
#   2. configs/environments/*.yaml  <- where it runs (device, MLflow store). Picked with
#                                      --env grid5000, or the SEANET_ENV variable. Default: local.
#   3. configs/models/**/*.yaml     <- the model: encoder, MIL pooling, training recipe, optuna
#   4. command-line flags           <- the last word (--model, --dataset, --seed, --smoke)
#
# So: nothing about an experiment is hard-coded in the Python. To run something different you
# change a config value or pass a flag - you never edit the pipeline.
#
#   python main.py single Coffee --model seanet_bottleneck_topk
#   python main.py train  --model baselines/millet --env grid5000

# ---------------------------------------------------------------------------------------
# WHICH MODEL
# ---------------------------------------------------------------------------------------
# The name of a file under configs/models/, without the .yaml. You may give the folder
# ("seanet/seanet_bottleneck_topk") or just the file name ("seanet_bottleneck_topk") - the
# loader searches for it and tells you if the name is unknown or ambiguous.
#
# The three folders say what a config IS:
#   configs/models/baselines/   MILLET and the classic baselines (fcn, resnet, ...)
#   configs/models/seanet/      our own encoder x pooling combinations
#   configs/models/ablations/   one-knob-at-a-time studies (top_frac, no focus penalty)
#
# List them all with:  python main.py models
model: seanet/seanet_bottleneck_topk

# ---------------------------------------------------------------------------------------
# WHAT TO RUN
# ---------------------------------------------------------------------------------------
run:
  mode: single # single = train + evaluate one dataset (the only mode for now)
  dataset: WebTraffic # the dataset to use when mode is "single"
  smoke: false # true = quick 3-epoch check (for testing the pipeline, NOT a real result)
  re_train: false # false = skip a dataset this model already finished (safe, resumable).
    # true  = train it AGAIN and replace its row in results.csv. Useful when
    #         you want to re-check a model without hand-editing the done list.
    #         MLflow keeps the old run either way, so nothing is lost.

# ---------------------------------------------------------------------------------------
# PREPROCESSING - how a series becomes MIL "instances"
# ---------------------------------------------------------------------------------------
# One instance = one timestep. That is the only representation the project uses; the old
# sliding-window mode was removed in seanetv7 because every result in results/ was produced
# per-timestep and windows cannot produce NDCG (they have no per-timestep ground truth).
#
# The train/validation split lives here too, because it is a preprocessing decision:
# a dataset smaller than min_train_for_val trains on everything and early-stops on the
# training loss instead (a 5-series validation set is noise, not a signal).
preprocessing:
  normalise: true # z-normalise each series (mean 0, std 1). Keep true - UCR units vary wildly.
  # NOTE: min_train_for_val / val_frac are part of the model's training block,
  # because they change the training recipe. See configs/models/**/<model>.yaml.

# ---------------------------------------------------------------------------------------
# REPRODUCIBILITY
# ---------------------------------------------------------------------------------------
# One seed drives python's random, numpy and torch (see seanet/utils.set_seed), so the same
# seed really does give the same run. A NEW seed ADDS a repeat row to results.csv; it never
# overwrites the seed-0 row, which is how we get the mean +- std numbers.
seed: 0

# ---------------------------------------------------------------------------------------
# OUTPUT PATHS
# ---------------------------------------------------------------------------------------
# Every model gets its OWN folder under results_dir, named "<config>__<encoder>__<pooling>",
# so two models can never mix their numbers up. See seanet/results.py for the layout.
output:
  results_dir: results/SEA_NET
  analysis_dir: results/analysis # the cross-model comparison figures and tables

# ---------------------------------------------------------------------------------------
# INTERPRETABILITY FIGURES  (python main.py interpret)
# ---------------------------------------------------------------------------------------
# Why WebTraffic: it is the only dataset that ships per-timestep ground truth, so it is the only
# one where the figure can shade the truly important region and let you CHECK that the model
# highlighted the right points. On a UCR dataset the same picture would be unverifiable.
# Why only correctly-predicted samples: the figure is meant to show what good evidence looks
# like - which points the model leaned on when it got the answer right.
interpretability:
  dataset: WebTraffic
  n_classes: 3 # cover the first N classes (0, 1, 2)
  per_class: 1 # correctly-predicted examples per class -> 3 figures per run

# ---------------------------------------------------------------------------------------
# MLFLOW  (defaults; the STORE is set per environment - see configs/environments/)
# ---------------------------------------------------------------------------------------
# MLflow is the project's lab notebook. Every real training run and every Optuna trial is
# recorded: the hyperparameters, the per-epoch train/val loss and accuracy, the final test
# metrics (accuracy, AOPCR, NDCG), the parameter count, the training time, and the weights.
#
# ONE experiment holds everything, on purpose, so a laptop run and a Grid5000 run of the same
# model can sit side by side in one table. Filter with the tags instead:
#     tags.env = 'grid5000'      tags.model_id = '...'      tags.encoder = '...'
#
# WHERE the runs go is decided by, in order:
#     1. the MLFLOW_TRACKING_URI environment variable  (point both machines at one server)
#     2. mlflow.tracking_uri from configs/environments/<env>.yaml
#     3. sqlite:///mlflow.db in the repo
# See guide/09_mlflow.md.
mlflow:
  enabled: true
  experiment_name: SEA-Net
  log_model_weights: true # false logs only params + metrics (saves disk on the 129-dataset sweep)
  split_by_model: false # true restores the old "one experiment per model per day" grouping

# ---------------------------------------------------------------------------------------
# OPTUNA  (defaults; the search space is per model - see the model file's optuna block)
# ---------------------------------------------------------------------------------------
# Optuna is OPTIONAL. Normal training never touches it. When you do run it
# (python main.py optuna), it calls exactly the same training pipeline, one trial at a time.
optuna:
  n_trials: 20
  sampler: tpe # tpe | random
  pruner: median # median | none
  direction: minimize # we search for the lowest validation loss

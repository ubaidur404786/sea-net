# main.yaml - the top-level settings for a run.
#
# This is the ONE file you edit to control a run. It says which model to use, which
# dataset to run, the random seed, and where the results go. The actual model settings
# (encoder, pooling, training hyperparameters) live in a separate file per model, under
# configs/models/<model>.yaml, and are loaded automatically based on the "model" value below.
#
# Nothing here is hardcoded in the Python code any more: "python main.py run" reads this
# file and builds everything from it. You can also override a few things on the command
# line, e.g. "python main.py run --model millet --dataset Coffee --smoke".

# which model to run. Must match a file configs/models/<model>.yaml
# options that exist today: seanet, millet   (transformer is a placeholder, not implemented yet)
model: seanet

# what to run
run:
  mode: single          # single = train + evaluate one dataset (the only mode for now)
  dataset: WebTraffic   # the dataset to use when mode is "single"
  smoke: false          # true = quick 3-epoch check (for testing the pipeline, NOT a real result)

# preprocessing: how each series is turned into "instances" for the MIL model.
#   single_point   = one instance is one timestep (MILLET's original setup; NDCG works here).
#   sliding_window = one instance is a window of the series; window_size / window_stride control it
#                    (NDCG is skipped in this mode - windows have no per-timestep ground truth).
preprocessing:
  instance_type: sliding_window   # single_point | sliding_window
  window_size: 5
  window_stride: 5

# random seed, so a run can be reproduced exactly
seed: 0

# device to train on. "auto" picks cuda -> mps -> cpu; you can also force "cpu" or "cuda".
device: auto

# where our output files are written. Each model gets its OWN folder under here, named after what
# the model is: "<encoder>_<pooling>", e.g. results/SEA_NET/mstcn_sep_additive/. That folder holds
# that model's results.csv, done_train_dataset.txt, logs, figures and interpretation figures, so two
# models can never mix their numbers up. See seanet/results.py.
output:
  results_dir: results/SEA_NET

# interpretability: MILLET-style per-sample explanation figures.
# These are produced by "python main.py interpret" - running that command IS the on/off switch.
#
# Why WebTraffic: it is the only dataset that ships per-timestep ground truth, so it is the only one
# where the figure can shade the truly important region and let you CHECK that the model highlighted
# the right points. On a UCR dataset the same picture would be unverifiable.
# Why only correctly-predicted samples: a figure is meant to show what good evidence looks like -
# which points the model leaned on when it got the answer right.
interpretability:
  dataset: WebTraffic       # which dataset to explain (WebTraffic is the one with ground truth)
  n_classes: 3              # cover the first N classes (0, 1, 2)
  per_class: 1              # how many correctly-predicted examples per class -> 3 figures per run

# mlflow: your automatic "lab notebook". EVERY training/evaluation run (run / single / webtraffic /
# train) AND every Optuna trial is recorded here: its inputs (hyperparameters), its results (train /
# validation / test accuracy + loss, AOPCR, NDCG), and the trained model saved as a *versioned* model.
# Open the web page to compare all models/datasets side by side and see which settings won. Browse with:
#   mlflow ui --backend-store-uri sqlite:///mlflow.db      (then open http://127.0.0.1:5000)
# See MLFLOW_GUIDE.md for how to view results locally and how to copy them back from Grid5000.
mlflow:
  enabled: true                     # turn all MLflow tracking on/off
  experiment_name: SEA-Net          # runs + trials are grouped under this experiment
  tracking_uri: "sqlite:///mlflow.db"   # a small local database file (mlflow.db) in the repo.
  log_model_weights: true           # also save each trained model as a versioned model (Models tab +
                                    # loading later). Set false to log only params + metrics (no weight
                                    # files) - e.g. to save disk during the full 129-dataset "train" sweep.
  # NOTE: recent MLflow dropped the old "./mlruns folder" store, so we use a SQLite file instead (this
  # is also what lets us save versioned models). mlflow.db + the saved weights under mlartifacts/ are
  # git-ignored and copy cleanly from Grid5000 to your laptop. Browse with:
  #   mlflow ui --backend-store-uri sqlite:///mlflow.db      (then open http://127.0.0.1:5000)
  # Leave tracking_uri blank to fall back to sqlite:///mlflow.db anyway. See MLFLOW_GUIDE.md.

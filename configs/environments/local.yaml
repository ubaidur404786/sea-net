# local.yaml - settings for a laptop / desktop (Windows or Linux, VS Code).
#
# WHAT THIS FILE IS FOR
#   The pipeline code is identical everywhere. Only these few settings change with the machine,
#   so they live here instead of being scattered through the code or duplicated in a second
#   "local training script". There is no local-only training path - there is one pipeline.
#
# HOW IT IS PICKED
#   This is the default. Any command also accepts --env <name>, and the SEANET_ENV environment
#   variable does the same thing:
#       python main.py single Coffee --model seanet_bottleneck_topk        (uses local)
#       SEANET_ENV=grid5000 python main.py train --model baselines/millet  (uses grid5000)

env: local

# "auto" picks cuda -> mps -> cpu. Force it with "cpu" if you want to be sure.
device: auto

mlflow:
  # WHERE the runs are stored on this machine.
  #
  # A local SQLite file, so nothing needs to be installed or started. Browse it with:
  #     mlflow ui --backend-store-uri sqlite:///mlflow.db      then open http://127.0.0.1:5000
  #
  # TO SHARE ONE TRACKING SYSTEM WITH GRID5000 instead, do not edit this file - set the standard
  # MLflow environment variable, which overrides it on both machines:
  #     export MLFLOW_TRACKING_URI=http://<your-mlflow-host>:5000
  # See guide/09_mlflow.md for the two ways to get one combined view (shared server, or copy
  # the database and merge).
  tracking_uri: "sqlite:///mlflow.db"
  # A laptop run is usually a check, not a keeper, so we do not fill the disk with weights.
  log_model_weights: false

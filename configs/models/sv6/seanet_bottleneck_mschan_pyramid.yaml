# sv6/seanet_bottleneck_mschan_pyramid.yaml - BOTH techniques stacked, on the smallest encoder.
#
# This is the fourth corner of a 2x2 experiment. The four configs together tell us whether the two
# techniques add up, or whether they are just two ways of saying the same thing:
#
#     channels    pyramid    config
#     --------    -------    ----------------------------------------
#        no          no      sv4/seanet_bottleneck_topk        (the baseline)
#       YES          no      sv6/seanet_bottleneck_mschan
#        no         YES      sv6/seanet_bottleneck_pyramid
#       YES         YES      sv6/seanet_bottleneck_mschan_pyramid   <- this file
#
# HOW TO READ THE RESULT: if this config beats both single-technique configs, the two are doing
# DIFFERENT jobs and stack. If it lands in between them, they overlap and we should ship the cheaper
# one alone. Either answer is a useful table row for the paper - it is a real experiment, not a guess.
#
# FIXED AFTER RUN 1: this was the worst of the batch (0.584 acc), because it carried BOTH problems at
# once - unnormalised channels AND a base whose receptive field swallowed three of the four scales.
# Both are fixed below. See sv6/seanet_bottleneck_pyramid.yaml for the receptive-field explanation.
#
# HOW THE NESTING WORKS: the wrappers nest, outermost first. The pyramid downsamples the series and
# runs its "base" at every scale; that base is the channel wrapper, which builds the rolling max/min/std
# channels; and ITS base is the bottleneck encoder. So the rolling statistics are computed separately at
# each scale, which is what we want - a rolling max over 31 points of the 8x-averaged copy covers a very
# different stretch of real time than the same window on the raw copy.
#
# Run it (WebTraffic by default):  python main.py run --model sv6/seanet_bottleneck_mschan_pyramid

name: seanet_bottleneck_mschan_pyramid
use_params: default

encoder:
  type: sea_multiscale_pyramid          # outer wrapper: downsample by 1, 2, 4, 8 and fuse
  scales: [1, 2, 4, 8]
  fusion: attention
  d_attn: 8
  per_scale_bn: true
  base:
    type: sea_multiscale_channels       # middle wrapper: add rolling max/min/std channels
    windows: [3, 7, 15, 31]
    stats: [max, min, std]
    add_diff_sign: true
    norm_channels: true                 # FIX 1 after run 1 - the built channels need normalising
    base:
      type: sea_mstcn_sep_bottleneck    # the real encoder - SHALLOW, FIX 2 after run 1
      d: 64
      n_blocks: 2                       # was 4 - the scales give the range, not the depth
      dropout: 0.2
      max_dilation: 1                   # was 16 - keeps every scale usable
      kernels: [5, 11, 23]
      bottleneck_ratio: 4

pooling:
  type: sea_topk_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true
  top_frac: 0.1

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam


# sv6/seanet_inputgate_mschan.yaml - Technique 3 (multi-scale INPUT CHANNELS) on our BEST-AOPCR encoder.
#
# Same idea as sv6/seanet_bottleneck_mschan (see that file for the full explanation). Here we wrap the
# input-gate encoder, which builds its gate straight from the RAW input.
#
# WHY THIS PAIRING IS INTERESTING: the input gate reads the input to decide which feature channels
# matter at each timestep. Today it only gets to read ONE channel (the raw value). With this wrapper it
# reads 13 channels, so the gate can now say things like "turn these channels up because the local
# spread (std) just jumped here" - which it simply could not express before. Of all six sv6 configs,
# this is the one where the technique and the encoder help each other the most.
#
# Baseline to beat: sv4/seanet_inputgate_topk = 0.946 acc, 2.8031 AOPCR, 0.7482 NDCG, 58,092 params.
#
# Run it (WebTraffic by default):  python main.py run --model sv6/seanet_inputgate_mschan

name: seanet_inputgate_mschan
use_params: default

encoder:
  type: sea_multiscale_channels
  windows: [3, 7, 15, 31]
  stats: [max, min, std]
  add_diff_sign: true
  norm_channels: true       # FIX after run 1 - see sv6/seanet_bottleneck_mschan.yaml for why. This model
                            # needed it MOST: the input-gate encoder reads the input TWICE (its stem and
                            # its gate conv), so it paid the scale-mismatch cost twice. Run 1 (without
                            # this) scored 0.874 acc - the biggest drop of the three channel models.
  base:                     # unchanged from sv4/seanet_inputgate_topk
    type: sea_mstcn_sep_inputgate
    d: 64
    n_blocks: 4
    dropout: 0.2
    max_dilation: 16
    kernels: [5, 11, 23]
    gate_kernel: 7

pooling:
  type: sea_topk_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true
  top_frac: 0.1

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam


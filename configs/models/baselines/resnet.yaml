# resnet.yaml - the MILLET ResNet baseline (a third baseline you can train through this pipeline).
#
# ResNet is one of the backbones the MILLET paper reports (see results/UCR/ResNet/). Same idea as
# fcn.yaml: only the encoder changes; the pooling head and training recipe are shared.

name: resnet

# ---- the encoder: MILLET's ResNet backbone (fixed 128-channel output) ----
encoder:
  type: mil_resnet

# ---- pooling: Conjunctive, to match how MILLET evaluates its backbones ----
pooling:
  type: mil_conjunctive
  d_attn: 8
  dropout: 0.1
  positional_encoding: true

# ---- the training recipe (same generic loop as the other models) ----
training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.0    # baselines have no attention-focus penalty
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

# ===== AUTO-FILLED RESULTS (managed by main.py - do not edit below this line) =====
# These records let you compare the DEFAULT recipe against Optuna's BEST without opening MLflow,
# and (with `use_params: auto`) train with whichever scored higher. They are filled in for you:
#   records.default     : metrics from our last real `python main.py run` (default recipe).
#   records.optuna_best : the params Optuna found + their metrics (`python main.py optuna`).

records:
  default:
    metrics:
      test_acc: 0.772
      test_loss: 0.8237
      test_auroc: 0.9566
      dataset: WebTraffic
      recorded: '2026-07-23 13:28:32'

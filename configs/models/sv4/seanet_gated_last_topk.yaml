# sv4/seanet_gated_last_topk.yaml - our best encoder + the NEW top-k pooling head.
#
# Same gated (summary=last) encoder as our WebTraffic winner, but the pooling now averages only the
# top-k most-supporting timesteps per class instead of all of them. This concentrates the decision on a
# few evidence points, which should raise AOPCR (deleting those points really hurts) and suit spikes.
# Only the pooling head changes vs seanet_gated_last, so it is a fair test of the new head.
#
# Run it (WebTraffic by default):  python main.py run --model sv4/seanet_gated_last_topk

name: seanet_gated_last_topk
use_params: default

encoder:
  type: mstcn_sep_gated
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  summary: last

pooling:
  type: topk_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true
  top_frac: 0.1           # keep the top 10% of timesteps per class (top_frac=1.0 = plain classwise)

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

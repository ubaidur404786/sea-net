# sv4/seanet_recon.yaml - encoder that adds a "residual" (unmatched-area) feature branch.
#
# The encoder tries to rebuild the input from its features; the residual (input - rebuilt) is the part
# it could NOT explain - the surprising bits that often carry the class evidence. Those residual points
# become a few extra feature channels, mixed back in (our "unmatched area" idea). No extra loss for now.
# Paired with our best pooling. Same recipe as the gated runs, so the only change is the encoder.
#
# Run it (WebTraffic by default):  python main.py run --model sv4/seanet_recon

name: seanet_recon
use_params: default

encoder:
  type: mstcn_sep_recon
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  d_res: 16               # how many feature channels to make from the residual (small on purpose)

pooling:
  type: classwise_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

# ===== AUTO-FILLED RESULTS (managed by main.py - do not edit below this line) =====

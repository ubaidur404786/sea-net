# sv4/seanet_bottleneck_softmax.yaml - AUTO-GENERATED by scripts/make_cross_configs.py
# encoder 'bottleneck' + pooling 'softmax'. Same small recipe as every other sv4 combo,
# so any difference in the results comes only from this encoder+pooling pair.
#
# Run it (WebTraffic by default):  python main.py run --model sv4/seanet_bottleneck_softmax

name: seanet_bottleneck_softmax
use_params: default

encoder:
  type: mstcn_sep_bottleneck
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  bottleneck_ratio: 4

pooling:
  type: softmax_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true
  temperature: 1.0

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

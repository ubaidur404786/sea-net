# sv4/seanet_gated_last.yaml - self-gating encoder, gate summarises time with the LAST timestep.
#
# See sv4/seanet_gated_max.yaml for the shared idea. Only encoder.summary differs (here: last).
# On WebTraffic this was our best small model so far (test_acc 0.924, ndcg 0.741, ~62k params).
#
# Run it (WebTraffic by default):  python main.py run --model sv4/seanet_gated_last

name: seanet_gated_last
use_params: default

encoder:
  type: sea_mstcn_sep_gated
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  summary: last           # this file: LAST timestep (a local view; kept so we can compare all three)

pooling:
  type: sea_classwise_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

# ===== AUTO-FILLED RESULTS (managed by main.py - do not edit below this line) =====
# These records let you compare the DEFAULT recipe against Optuna's BEST without opening MLflow,
# and (with `use_params: auto`) train with whichever scored higher. They are filled in for you:
#   records.default     : metrics from our last real `python main.py run` (default recipe).
#   records.optuna_best : the params Optuna found + their metrics (`python main.py optuna`).

records:
  default:
    metrics:
      test_acc: 0.942
      test_loss: 0.3272
      test_auroc: 0.9966
      dataset: WebTraffic
      recorded: '2026-07-23 13:38:07'

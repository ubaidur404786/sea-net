# sv4/seanet_gated_last.yaml - self-gating encoder, gate summarises time with the LAST timestep.
#
# See sv4/seanet_gated_max.yaml for the shared idea. Only encoder.summary differs (here: last).
# On WebTraffic this was our best small model so far (test_acc 0.924, ndcg 0.741, ~62k params).
#
# Run it (WebTraffic by default):  python main.py run --model sv4/seanet_gated_last

name: seanet_gated_last
use_params: default

encoder:
  type: mstcn_sep_gated
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  summary: last           # this file: LAST timestep (a local view; kept so we can compare all three)

pooling:
  type: classwise_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

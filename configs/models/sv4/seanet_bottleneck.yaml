# sv4/seanet_bottleneck.yaml - the SMALLER encoder (bottleneck blocks).
#
# The d->d pointwise conv is where most params live. This encoder splits it into d->r->d with a narrow
# middle r = d // bottleneck_ratio, so the model is much smaller. We pair it with our best pooling head
# (classwise_conjunctive) to see how much accuracy we keep for the size cut. Same recipe as the gated
# runs, so the only change is the encoder.
#
# Run it (WebTraffic by default):  python main.py run --model sv4/seanet_bottleneck

name: seanet_bottleneck
use_params: default

encoder:
  type: sea_mstcn_sep_bottleneck
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  bottleneck_ratio: 4     # middle width r = d // 4 (bigger ratio = smaller model). try 2 / 4 / 8

pooling:
  type: sea_classwise_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

# ===== AUTO-FILLED RESULTS (managed by main.py - do not edit below this line) =====
# These records let you compare the DEFAULT recipe against Optuna's BEST without opening MLflow,
# and (with `use_params: auto`) train with whichever scored higher. They are filled in for you:
#   records.default     : metrics from our last real `python main.py run` (default recipe).
#   records.optuna_best : the params Optuna found + their metrics (`python main.py optuna`).

records:
  default:
    metrics:
      test_acc: 0.902

# sv4/seanet_gated_mean.yaml - self-gating encoder, gate summarises time with MEAN.
#
# See sv4/seanet_gated_max.yaml for the shared idea. Only encoder.summary differs (here: mean).
#
# Run it (WebTraffic by default):  python main.py run --model sv4/seanet_gated_mean

name: seanet_gated_mean
use_params: default

encoder:
  type: mstcn_sep_gated
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  summary: mean           # this file: MEAN (average level of each channel - good for smooth trends)

pooling:
  type: classwise_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

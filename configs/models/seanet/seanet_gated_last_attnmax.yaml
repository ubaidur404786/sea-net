# seanet/seanet_gated_last_attnmax.yaml - our best encoder + the NEW attention-max pooling head.
#
# Same gated (summary=last) encoder as our WebTraffic winner, but the pooling blends mean-over-time and
# max-over-time with a learnable per-class weight, so each class decides if its evidence is a trend
# (mean) or a spike (max). Only the pooling head changes vs seanet_gated_last, so it is a fair test.
#
# Run it (WebTraffic by default):  python main.py run --model seanet/seanet_gated_last_attnmax

name: seanet_gated_last_attnmax
use_params: default

encoder:
  type: sea_mstcn_sep_gated
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  summary: last

pooling:
  type: sea_attention_max
  d_attn: 8
  dropout: 0.2
  positional_encoding: true
  init_lam: 0.5           # start halfway between mean and max; learned per class from here

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

# ===== AUTO-FILLED RESULTS (managed by main.py - do not edit below this line) =====

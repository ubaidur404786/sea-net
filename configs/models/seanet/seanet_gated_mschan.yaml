# seanet/seanet_gated_mschan.yaml - Technique 3 (multi-scale INPUT CHANNELS) on our BEST-accuracy encoder.
#
# Same idea as seanet/seanet_bottleneck_mschan (see that file for the full explanation): add rolling
# max/min/std channels so each timestep also knows what its wider neighbourhood looks like. The only
# difference here is the encoder we wrap - the self-gating one, which currently holds rank 1.
#
# This is the "can the best model get better" test. If multi-scale channels only help the small
# encoder, that means they are just making up for missing capacity. If they help the best one too,
# they are adding genuinely new information.
#
# Baseline to beat: seanet/seanet_gated_mean_topk = 0.954 acc, 2.2926 AOPCR, 0.7721 NDCG, 61,740 params.
#
# Run it (WebTraffic by default):  python main.py run --model seanet/seanet_gated_mschan

name: seanet_gated_mschan
use_params: default

encoder:
  type: sea_multiscale_channels
  windows: [3, 7, 15, 31]
  stats: [max, min, std]
  add_diff_sign: true
  norm_channels: true       # FIX after run 1 - see seanet/seanet_bottleneck_mschan.yaml for why.
                            # Run 1 (without this) scored 0.908 acc / 2.191 AOPCR.
  base:                     # unchanged from seanet/seanet_gated_mean_topk
    type: sea_mstcn_sep_gated
    d: 64
    n_blocks: 4
    dropout: 0.2
    max_dilation: 16
    kernels: [5, 11, 23]
    summary: mean

pooling:
  type: sea_topk_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true
  top_frac: 0.1

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

# ===== AUTO-FILLED RESULTS (managed by main.py - do not edit below this line) =====
# These records let you compare the DEFAULT recipe against Optuna's BEST without opening MLflow,
# and (with `use_params: auto`) train with whichever scored higher. They are filled in for you:
#   records.default     : metrics from our last real `python main.py run` (default recipe).
#   records.optuna_best : the params Optuna found + their metrics (`python main.py optuna`).

records:
  default:
    metrics:
      test_acc: 0.948
      test_loss: 0.2886
      test_auroc: 0.998
      dataset: WebTraffic
      recorded: '2026-08-03 22:32:09'

# encoder 'inputgate' + pooling 'attnmax'. Same small recipe as every other combo,
# so any difference in the results comes only from this encoder+pooling pair.
#
# Run it (WebTraffic by default):  python main.py run --model seanet/seanet_inputgate_attnmax

name: seanet_inputgate_attnmax
use_params: default

encoder:
  type: sea_mstcn_sep_inputgate
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  gate_kernel: 7

pooling:
  type: sea_attention_max
  d_attn: 8
  dropout: 0.2
  positional_encoding: true
  init_lam: 0.5

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam


# seanet/seanet_bottleneck_gatedattn.yaml
# Smallest encoder + the NEW gated-attention pooling head. Targets the "small model" end-goal.
#
# ENCODER = mstcn_sep_bottleneck: same as the plain encoder, but the expensive d->d pointwise 1x1 conv
#   is factorised into d->r->d (r = d // bottleneck_ratio), cutting most of the parameters.
#
# POOLING = gated_attention  (Ilse et al. 2018 gated-attention MIL; the MS-DA-MIL paper-1 family)
#   For each timestep j and class k, over encoder features z_j:
#     A_j       = tanh(V z_j) * sigmoid(U z_j)   # gated attention features (* = elementwise)
#     alpha_j^k = softmax_j( (W A_j)_k )         # attention distribution OVER TIME (sums to 1 per class)
#     p_j^k     = classifier(z_j)_k              # per-timestep class logit
#     Y^k       = sum_j alpha_j^k * p_j^k        # weighted average over time (length-invariant)
#   The extra sigmoid gate makes the attention richer than plain tanh attention. interpretation = alpha * p.
#
# Run it (WebTraffic by default):  python main.py run --model seanet/seanet_bottleneck_gatedattn

name: seanet_bottleneck_gatedattn
use_params: default

encoder:
  type: sea_mstcn_sep_bottleneck   # smallest encoder: the d->d 1x1 conv is factorised to d->r->d
  d: 64                   # channel width (the main size knob)
  n_blocks: 4             # how many multi-scale residual blocks are stacked
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  bottleneck_ratio: 4     # middle width r = d // 4 (bigger ratio = smaller model)

pooling:
  type: sea_gated_attention
  d_attn: 8               # width of the two attention branches (tanh V and sigmoid U)
  dropout: 0.2
  positional_encoding: true

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam


# sv5/seanet_slim_dualstream.yaml
# Plain (un-gated) encoder + the NEW dual-stream pooling head. This isolates the pooling: if it beats
# sv4/seanet_slim (same encoder, classwise_conjunctive), the gain is purely from the DSMIL stream.
#
# ENCODER = mstcn_sep: the plain multi-scale separable TCN (no gate) - our clean baseline encoder.
#
# POOLING = dualstream_conjunctive  (ported from DSMIL, Li et al. 2021)
#   Two streams over encoder features z_j (j = timestep, k = class), then blended:
#     Stream A (= classwise Conjunctive, the safe baseline):
#         a_j^k = sigmoid((W_A z_j)_k);  p_j^k = classifier(z_j)_k;  g_j^k = a_j^k * p_j^k
#         Ymean^k = mean_j g_j^k
#     Stream B (DSMIL "critical timestep" focus, the AOPCR booster):
#         m_k = argmax_j g_j^k;  q_j = W_q z_j;  U_j^k = softmax_j <q_j, q_{m_k}>;  Yds^k = sum_j U_j^k * p_j^k
#     Blend:  lam = sigmoid(theta) in [0,1] (learned),  Y^k = (1-lam)*Ymean^k + lam*Yds^k
#   lam starts ~0 (init_lam) so it can only match or beat Conjunctive. Concentrating the evidence on the
#   critical timestep (and the timesteps that look like it) is aimed at raising AOPCR.
#
# Run it (WebTraffic by default):  python main.py run --model sv5/seanet_slim_dualstream

name: seanet_slim_dualstream
use_params: default

encoder:
  type: mstcn_sep         # plain MSTCN-separable encoder (no gate) - clean baseline
  d: 64                   # channel width (the main size knob)
  n_blocks: 4             # how many multi-scale residual blocks are stacked
  dropout: 0.2
  max_dilation: 16        # dilation grows 1,2,4,8 (capped at 16) - keeps each view local
  kernels: [5, 11, 23]    # three depthwise kernel sizes, summed in every block

pooling:
  type: dualstream_conjunctive
  d_attn: 8               # width of the attention MLP AND the query vector (W_q: d -> d_attn)
  init_lam: 0.05          # blend starts near 0 -> begins as plain Conjunctive (safe), training raises it
  dropout: 0.2
  positional_encoding: true

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam


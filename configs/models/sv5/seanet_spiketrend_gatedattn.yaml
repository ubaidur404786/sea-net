# sv5/seanet_spiketrend_gatedattn.yaml
# Spike/trend encoder + the NEW gated-attention pooling head.
#
# ENCODER = mstcn_sep_spiketrend: TWO branches - a trend branch (smooth, long-range) and a spike branch
#   (high-pass: x - local_average(x), so only sudden jumps survive) - mixed by a 1x1 conv, then gated.
#
# POOLING = gated_attention  (Ilse et al. 2018 gated-attention MIL; the MS-DA-MIL paper-1 family)
#   For each timestep j and class k, over encoder features z_j:
#     A_j       = tanh(V z_j) * sigmoid(U z_j)   # gated attention features (* = elementwise)
#     alpha_j^k = softmax_j( (W A_j)_k )         # attention distribution OVER TIME (sums to 1 per class)
#     p_j^k     = classifier(z_j)_k              # per-timestep class logit
#     Y^k       = sum_j alpha_j^k * p_j^k        # weighted average over time (length-invariant)
#   The extra sigmoid gate makes the attention richer than plain tanh attention. interpretation = alpha * p.
#
# Run it (WebTraffic by default):  python main.py run --model sv5/seanet_spiketrend_gatedattn

name: seanet_spiketrend_gatedattn
use_params: default

encoder:
  type: mstcn_sep_spiketrend   # two branches: trend (smooth) + spike (high-pass), then mixed and gated
  d: 64                   # width of the trend branch (the main size knob)
  n_blocks: 4             # depth of the trend branch
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  summary: last           # the gate summary that won on WebTraffic: max | mean | last
  d_spike: 16             # how many spike feature channels (small on purpose)
  smooth_kernel: 5        # window of the local average in the spike branch (odd, keeps length T)

pooling:
  type: gated_attention
  d_attn: 8               # width of the two attention branches (tanh V and sigmoid U)
  dropout: 0.2
  positional_encoding: true

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

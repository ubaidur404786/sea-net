# seanet_classwise.yaml - SEA-Net encoder + our "classwise_conjunctive" pooling head.
#
# This is a copy of seanet.yaml with ONLY the pooling head changed, so a run against it is a fair
# A/B test versus the Conjunctive baseline (encoder + training recipe are kept identical). This head
# gives each class its OWN sigmoid attention gate (MILLET Conjunctive uses a single shared gate),
# which makes the per-class explanations sharper. Run it with:
#   python main.py run --model seanet_classwise            (WebTraffic by default)
#   python main.py run --model seanet_classwise --dataset Coffee --smoke

name: seanet_classwise

# which recipe to train with: default | optuna_best | auto  (see seanet.yaml for the full explanation).
# 'auto' uses Optuna's best only if it scored a higher test accuracy than the default recipe.
use_params: auto

# ---- the encoder (identical to seanet.yaml) ----
encoder:
  type: mstcn_sep        # our "Multi-Scale separable TCN" encoder
  d: 128                 # channel width the encoder works with
  n_blocks: 6            # how many residual blocks are stacked
  dropout: 0.2           # dropout inside the encoder blocks
  max_dilation: 16       # dilation grows 1,2,4,8,16 but is capped here (keeps each view local)
  kernels: [5, 11, 23]   # the three depthwise kernel sizes, summed in every block

# ---- the pooling head (THE ONLY DIFFERENCE vs seanet.yaml) ----
pooling:
  type: classwise_conjunctive   # one sigmoid attention gate PER CLASS (vs Conjunctive's shared gate)
  d_attn: 8                     # width of the small attention MLP
  dropout: 0.2
  positional_encoding: true

# ---- the training recipe (identical to seanet.yaml) ----
training:
  n_epochs: 400          # max epochs (early stopping usually stops sooner)
  patience: 60           # stop if the watched loss has not improved for this many epochs
  max_batch: 16          # batch size = clamp(n_train // 10, 2, max_batch)
  learning_rate: 0.00125 # 1.25e-3
  weight_decay: 0.00012  # 1.2e-4
  label_smoothing: 0.13  # softens the labels a little (helps avoid over-confident mistakes)
  lambda_entropy: 0.01   # strength of the attention "focus" penalty (0 turns it off)
  min_train_for_val: 100 # need at least this many train series to hold out a validation set
  val_frac: 0.2          # size of the validation split (20%)
  optimizer: adam        # the only optimizer wired up right now

# ---- Optuna hyperparameter search (disabled by default) ----
# Run with:  python main.py optuna --model seanet_classwise
# After the search the best config is retrained + scored on test and saved into the records block at the
# BOTTOM of this file (records.optuna_best) - no separate .best.yaml. See seanet.yaml for the details.
optuna:
  enabled: true
  n_trials: 30                 # big search space (training + encoder + pooling) -> use plenty of trials
  timeout: null
  sampler: tpe
  pruner: median
  save_best_parameters: true
  # DETAILED search: the training recipe, the ENCODER (feature extractor) AND the POOLING head together.
  search_space:
    training:
      learning_rate: {type: float, low: 0.0003, high: 0.005, log: true}
      weight_decay: {type: float, low: 0.00001, high: 0.0005, log: true}
      label_smoothing: {type: float, low: 0.0, high: 0.2}
      lambda_entropy: {type: float, low: 0.0, high: 0.05}
      max_batch: {type: categorical, choices: [8, 16, 32]}
    encoder:
      d: {type: categorical, choices: [64, 96, 128]}
      n_blocks: {type: int, low: 3, high: 8}
      dropout: {type: float, low: 0.1, high: 0.4}
      max_dilation: {type: categorical, choices: [8, 16, 32]}
    pooling:
      d_attn: {type: categorical, choices: [4, 8, 16, 32]}
      dropout: {type: float, low: 0.1, high: 0.4}

# ===== AUTO-FILLED RESULTS (managed by main.py - do not edit below this line) =====
# These records let you compare the DEFAULT recipe against Optuna's BEST without opening MLflow,
# and (with `use_params: auto`) train with whichever scored higher. They are filled in for you:
#   records.default     : metrics from our last real `python main.py run` (default recipe).
#   records.optuna_best : the params Optuna found + their metrics (`python main.py optuna`).

records:
  optuna_best:
    params:
      training:
        learning_rate: 0.0007339198007141648
        weight_decay: 5.056155262003501e-05
        label_smoothing: 0.012829499269756873
        lambda_entropy: 0.034623605968500996
        max_batch: 8
      encoder:
        d: 128
        n_blocks: 4
        dropout: 0.3002231139891045
        max_dilation: 16
      pooling:
        d_attn: 32
        dropout: 0.10140864285776413
    metrics:
      test_acc: 0.934
      test_loss: 0.2312
      test_auroc: 0.9967
      val_loss: 0.5112
      dataset: WebTraffic
      n_trials: 30

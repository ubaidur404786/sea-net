# seanet_conjunctive.yaml - SEA-Net encoder + MILLET's Conjunctive pooling head.
#
# A copy of seanet.yaml with ONLY the pooling head changed to `conjunctive` (MILLET's proposed
# baseline), so you can sweep / Optuna-tune Conjunctive on the SAME SEA-Net encoder as every other
# head - a fair comparison. Its results go to results/SEA_NET/mstcn_sep_conjunctive/. Run with:
#   python main.py train  --model seanet_conjunctive
#   python main.py run    --model seanet_conjunctive --dataset WebTraffic
#   python main.py optuna --model seanet_conjunctive --dataset WebTraffic

name: seanet_conjunctive

# which recipe to train with: default | optuna_best | auto  (see seanet.yaml for the full explanation).
# 'auto' uses Optuna's best only if it scored a higher test accuracy than the default recipe.
use_params: auto

# ---- the encoder (identical to seanet.yaml) ----
encoder:
  type: sea_mstcn_sep
  d: 128
  n_blocks: 6
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]

# ---- the pooling head (THE ONLY DIFFERENCE vs seanet.yaml) ----
pooling:
  type: mil_conjunctive      # MILLET's MILConjunctivePooling (reused unchanged) - the paper's baseline
  d_attn: 8              # width of the small attention MLP
  dropout: 0.2
  positional_encoding: true

# ---- the training recipe (identical to seanet.yaml) ----
training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

# ---- Optuna hyperparameter search (disabled by default) ----
# Run with:  python main.py optuna --model seanet_conjunctive
# After the search the best config is retrained + scored on test and saved into the records block at the
# BOTTOM of this file (records.optuna_best) - no separate .best.yaml. See seanet.yaml for the details.
optuna:
  enabled: true
  n_trials: 30                 # big search space (training + encoder + pooling) -> use plenty of trials
  timeout: null
  sampler: tpe
  pruner: median
  save_best_parameters: true
  # DETAILED search: the training recipe, the ENCODER (feature extractor) AND the POOLING head together.
  search_space:
    training:
      learning_rate: {type: float, low: 0.0003, high: 0.005, log: true}
      weight_decay: {type: float, low: 0.00001, high: 0.0005, log: true}
      label_smoothing: {type: float, low: 0.0, high: 0.2}
      lambda_entropy: {type: float, low: 0.0, high: 0.05}
      max_batch: {type: categorical, choices: [8, 16, 32]}
    encoder:
      d: {type: categorical, choices: [64, 96, 128]}
      n_blocks: {type: int, low: 3, high: 8}
      dropout: {type: float, low: 0.1, high: 0.4}
      max_dilation: {type: categorical, choices: [8, 16, 32]}
    pooling:
      d_attn: {type: categorical, choices: [4, 8, 16, 32]}
      dropout: {type: float, low: 0.1, high: 0.4}

# ===== AUTO-FILLED RESULTS (managed by main.py - do not edit below this line) =====
# These records let you compare the DEFAULT recipe against Optuna's BEST without opening MLflow,
# and (with `use_params: auto`) train with whichever scored higher. They are filled in for you:
#   records.default     : metrics from our last real `python main.py run` (default recipe).
#   records.optuna_best : the params Optuna found + their metrics (`python main.py optuna`).


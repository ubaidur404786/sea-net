# ablations/seanet_topk_voting.yaml - VOTING instead of averaging the top-k evidence.
#
# The idea: take the k best timesteps, and let each one VOTE for the class it supports most. With
# k = ceil(0.1 * 1008) = 101 points on WebTraffic the vote vector might come out as [60, 30, 11],
# and the series is called whichever class collected the most votes.
#
# This uses its OWN pooling head, sea_topk_voting. sea_topk_conjunctive (our best model) is left
# exactly as it is, so the two can be compared without one being able to affect the other.
#
# The votes are SOFT: each timestep still casts exactly one vote, but may split it between classes.
# A hard argmax vote has no gradient at all, so the encoder would never learn anything from it.
# See guide/15_voting_pooling.md.
#
# Baseline to beat: top/top_bottleneck_topk = 0.942 acc, 2.951 AOPCR, 0.786 NDCG (same encoder).
#
# Run it:  python main.py webtraffic --model ablations/seanet_topk_voting

extends: seanet/seanet_bottleneck_topk
name: seanet_topk_voting

pooling:
  type: sea_topk_voting     # the separate voting head (NOT sea_topk_conjunctive)
  temperature: 0.5          # < 1 makes each vote sharper (closer to "all of it to the winner")
  hard: false               # soft votes: the honest differentiable version

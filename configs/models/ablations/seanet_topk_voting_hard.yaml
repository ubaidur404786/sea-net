# ablations/seanet_topk_voting_hard.yaml - STRICT voting (one whole vote to the winner).
#
# Same as ablations/seanet_topk_voting, but the forward pass casts a REAL hard vote: at each of the
# k chosen timesteps the winning class gets 1 and the others get 0, giving exactly the [15, 10, 5]
# vector the idea describes.
#
# The catch, stated openly: argmax has no gradient. To train at all we use the standard
# straight-through estimator - forward pass hard, backward pass borrowing the soft vote's gradient.
# The gradient the encoder receives therefore does NOT match the function the forward pass computed.
#
# RESULT (2026-09-03, WebTraffic, seed 0): 0.672 accuracy, and training accuracy never got past
# 0.757 - it could not even fit the training data. That is the biased gradient showing. Kept as the
# record of a tested idea; do not spend more GPU time on it.
#
# Run it:  python main.py webtraffic --model ablations/seanet_topk_voting_hard

extends: seanet/seanet_bottleneck_topk
name: seanet_topk_voting_hard

pooling:
  type: sea_topk_voting
  temperature: 0.5          # now only used by the backward pass
  hard: true                # forward = a real 1/0 vote (straight-through backward)

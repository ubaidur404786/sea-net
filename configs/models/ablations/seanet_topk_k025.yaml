# ablations/seanet_topk_k025.yaml - top-k fraction ablation, kappa = 0.25
#
# Why this ablation exists: every top-k config we trained so far fixes top_frac = 0.1, so we have no evidence
# for Property 6.4 in the report ("kappa = 1 recovers class-wise conjunctive pooling"). This folder
# is the same model five times with ONLY top_frac changed, so any difference is the fraction.
#
# The base is seanet/seanet_bottleneck_topk (kappa = 0.1), the model the results section is built on.
# Copy that file exactly and change one line - do not tidy anything else, or the ablation is not
# controlled any more.
#
# Run it (WebTraffic only - this is a screening ablation, not a full sweep):
#   python main.py webtraffic --model ablations/seanet_topk_k025

name: seanet_topk_k025
use_params: default

encoder:
  type: sea_mstcn_sep_bottleneck
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels: [5, 11, 23]
  bottleneck_ratio: 4

pooling:
  type: sea_topk_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true
  top_frac: 0.25 # <-- the only line that differs from seanet/seanet_bottleneck_topk

training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam

# ablations/seanet_topk_voting_thresh.yaml - voting, with ambiguous timesteps silenced.
#
# On top of ablations/seanet_topk_voting: if at one timestep the best class and the second-best class
# score almost the same, that timestep is not really evidence for anybody, so it is not allowed to
# vote. The vote share is then divided by how many timesteps ACTUALLY voted, not by k - otherwise
# removing voters would quietly make the model less confident instead of more.
#
# WHAT THE NUMBER MEANS. The gap is measured on the per-timestep class PROBABILITIES (softmax over
# classes of the gated evidence), so it always sits in [0, 1] and 0.002 means "the best two classes
# are within 0.2 percentage points". On the raw evidence scale the same number would mean something
# different in every model, because that scale is an unnormalised logit.
#
# Sweep it: 0.002 -> 0.01 -> 0.05 -> 0.10, watching accuracy AND AOPCR. If nothing moves it is too
# small to matter; if accuracy falls it is throwing away real evidence.
#
# Safety: if the threshold silences EVERY chosen timestep of a series, the head lets them all vote
# again for that series, so the loss can never become NaN.
#
# Run it:  python main.py webtraffic --model ablations/seanet_topk_voting_thresh

extends: seanet/seanet_bottleneck_topk
name: seanet_topk_voting_thresh

pooling:
  type: sea_topk_voting
  temperature: 0.5
  hard: false
  confidence_threshold: 0.002   # 0.0 = off

name: seanet_topk_thresh
use_params: default
encoder:
  type: sea_mstcn_sep_bottleneck
  d: 64
  n_blocks: 4
  dropout: 0.2
  max_dilation: 16
  kernels:
  - 5
  - 11
  - 23
  bottleneck_ratio: 4
pooling:
  type: sea_topk_conjunctive
  d_attn: 8
  dropout: 0.2
  positional_encoding: true
  top_frac: 0.1
  confidence_threshold: 0.002
training:
  n_epochs: 400
  patience: 60
  max_batch: 16
  learning_rate: 0.00125
  weight_decay: 0.00012
  label_smoothing: 0.13
  lambda_entropy: 0.01
  min_train_for_val: 100
  val_frac: 0.2
  optimizer: adam
